name: security                      # name shown in the Actions tab

on:                                 # WHEN it runs
  pull_request:
    branches: [dev, main]           # every PR into dev or main
  push:
    branches: [dev, main]           # and after every merge

permissions:                        # least privilege: read-only token
  contents: read
  pull-requests: read

jobs:
  gitleaks:                         # job name = the check name you'll require in 6b
    runs-on: ubuntu-latest          # a fresh Linux machine from GitHub
    steps:
      - uses: actions/checkout@v4   # download the repo code
        with:
          fetch-depth: 0            # full history, so Gitleaks scans every commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
